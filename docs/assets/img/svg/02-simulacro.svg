<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="950" viewBox="0 0 1150 950"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#55584f" stroke-width="1.8"/></marker><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#5b7181" stroke-width="1.8"/></marker></defs><rect width="1150" height="950" fill="#fcfcfa"/><text x="40.0" y="46.0" font-family="IBM Plex Mono, serif" font-size="13" fill="#2e4551" text-anchor="start" letter-spacing="0.12em">FIGURA 2</text><text x="40.0" y="80.0" font-family="Spectral SemiBold, serif" font-size="25" fill="#191a18" text-anchor="start">Las posiciones del simulacro de emoción</text><text x="40.0" y="106.0" font-family="IBM Plex Sans Condensed, serif" font-size="16" fill="#55584f" text-anchor="start">Cada posición se resuelve en un paso distinto del análisis y conserva la marca que la sostiene.</text><line x1="40.0" y1="126.0" x2="1110.0" y2="126.0" stroke="#191a18" stroke-width="1.8"/><rect x="430.0" y="180.0" width="250.0" height="140.0" fill="#fcfcfa" stroke="#c9ccc5" stroke-width="1.3" stroke-dasharray="4 3"/><text x="555.0" y="218.0" font-family="Spectral SemiBold, serif" font-size="18" fill="#191a18" text-anchor="middle">Verificador normativo</text><text x="555.0" y="244.0" font-family="IBM Plex Sans Condensed, serif" font-size="14.5" fill="#55584f" text-anchor="middle">¿se ajusta a una norma?</text><rect x="740.0" y="180.0" width="250.0" height="140.0" fill="#fcfcfa" stroke="#c9ccc5" stroke-width="1.3" stroke-dasharray="4 3"/><text x="865.0" y="218.0" font-family="Spectral SemiBold, serif" font-size="18" fill="#191a18" text-anchor="middle">Verificador observacional</text><text x="865.0" y="244.0" font-family="IBM Plex Sans Condensed, serif" font-size="14.5" fill="#55584f" text-anchor="middle">¿es auténtica? ¿su causa es la</text><text x="865.0" y="262.0" font-family="IBM Plex Sans Condensed, serif" font-size="14.5" fill="#55584f" text-anchor="middle">declarada?</text><rect x="40.0" y="431.0" width="200.0" height="118.0" fill="#fcfcfa" stroke="#c9ccc5" stroke-width="1.3"/><line x1="40.0" y1="431.0" x2="240.0" y2="431.0" stroke="#a6412c" stroke-width="3"/><text x="140.0" y="469.0" font-family="Spectral SemiBold, serif" font-size="18" fill="#191a18" text-anchor="middle">Fuente</text><text x="140.0" y="495.0" font-family="IBM Plex Sans Condensed, serif" font-size="14.5" fill="#55584f" text-anchor="middle">la origina</text><rect x="313.0" y="431.0" width="200.0" height="118.0" fill="#fcfcfa" stroke="#c9ccc5" stroke-width="1.3" stroke-dasharray="4 3"/><text x="413.0" y="469.0" font-family="Spectral SemiBold, serif" font-size="18" fill="#191a18" text-anchor="middle">Mediador</text><text x="413.0" y="495.0" font-family="IBM Plex Sans Condensed, serif" font-size="14.5" fill="#55584f" text-anchor="middle">la transporta</text><rect x="586.0" y="420.0" width="250.0" height="140.0" fill="#fcfcfa" stroke="#c9ccc5" stroke-width="1.3"/><line x1="586.0" y1="420.0" x2="836.0" y2="420.0" stroke="#2c6e63" stroke-width="3"/><text x="711.0" y="458.0" font-family="Spectral SemiBold, serif" font-size="18" fill="#191a18" text-anchor="middle">Emoción</text><text x="711.0" y="484.0" font-family="IBM Plex Sans Condensed, serif" font-size="14.5" fill="#55584f" text-anchor="middle">tipo, foria, intensidad, modo de</text><text x="711.0" y="502.0" font-family="IBM Plex Sans Condensed, serif" font-size="14.5" fill="#55584f" text-anchor="middle">existencia</text><rect x="910.0" y="431.0" width="200.0" height="118.0" fill="#fcfcfa" stroke="#c9ccc5" stroke-width="1.3"/><line x1="910.0" y1="431.0" x2="1110.0" y2="431.0" stroke="#2e4551" stroke-width="3"/><text x="1010.0" y="469.0" font-family="Spectral SemiBold, serif" font-size="18" fill="#191a18" text-anchor="middle">Experienciador</text><text x="1010.0" y="495.0" font-family="IBM Plex Sans Condensed, serif" font-size="14.5" fill="#55584f" text-anchor="middle">quien la siente</text><rect x="586.0" y="560.0" width="250.0" height="32.0" fill="#f4f4f0" stroke="#c9ccc5" stroke-width="1.3"/><text x="711.0" y="581.0" font-family="IBM Plex Sans Condensed, serif" font-size="14.5" fill="#55584f" text-anchor="middle">afirmada · negada</text><rect x="298.0" y="660.0" width="230.0" height="132.0" fill="#fcfcfa" stroke="#c9ccc5" stroke-width="1.3" stroke-dasharray="4 3"/><text x="413.0" y="698.0" font-family="Spectral SemiBold, serif" font-size="18" fill="#191a18" text-anchor="middle">Operador de</text><text x="413.0" y="720.0" font-family="Spectral SemiBold, serif" font-size="18" fill="#191a18" text-anchor="middle">modificación</text><text x="413.0" y="746.0" font-family="IBM Plex Sans Condensed, serif" font-size="14.5" fill="#55584f" text-anchor="middle">actúa sobre ella: la activa, la</text><text x="413.0" y="764.0" font-family="IBM Plex Sans Condensed, serif" font-size="14.5" fill="#55584f" text-anchor="middle">bloquea, la argumenta</text><path d="M246,490 L303,490" fill="none" stroke="#55584f" stroke-width="1.5" marker-end="url(#a)"/><path d="M519,490 L576.0,490" fill="none" stroke="#55584f" stroke-width="1.5" marker-end="url(#a)"/><path d="M846.0,490 L900,490" fill="none" stroke="#55584f" stroke-width="1.5" marker-end="url(#a)"/><path d="M555,328 C555,390 560.0,370 616.0,408.0" fill="none" stroke="#5b7181" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#af)"/><path d="M865,328 C865,390 862.0,370 806.0,408.0" fill="none" stroke="#5b7181" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#af)"/><path d="M413,652 C413,606 540.0,640 632.0,602.0" fill="none" stroke="#5b7181" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#af)"/><line x1="40.0" y1="848.0" x2="1110.0" y2="848.0" stroke="#191a18" stroke-width="1.8"/><text x="40.0" y="873.0" font-family="IBM Plex Mono, serif" font-size=