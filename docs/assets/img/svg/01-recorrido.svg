<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#55584f" stroke-width="1.8"/></marker><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#5b7181" stroke-width="1.8"/></marker></defs><rect width="1000" height="1010" fill="#fcfcfa"/><text x="40.0" y="46.0" font-family="IBM Plex Mono, serif" font-size="13" fill="#2e4551" text-anchor="start" letter-spacing="0.12em">FIGURA 1</text><text x="40.0" y="80.0" font-family="Spectral SemiBold, serif" font-size="25" fill="#191a18" text-anchor="start">El recorrido de un texto</text><text x="40.0" y="106.0" font-family="IBM Plex Sans Condensed, serif" font-size="16" fill="#55584f" text-anchor="start">Del corpus de entrada al tablero, con la revisión humana como paso intermedio.</text><line x1="40.0" y1="126.0" x2="960.0" y2="126.0" stroke="#191a18" stroke-width="1.8"/><rect x="40.0" y="168.0" width="600.0" height="118.0" fill="#fcfcfa" stroke="#c9ccc5" stroke-width="1.3"/><text x="60.0" y="198.0" font-family="IBM Plex Mono, serif" font-size="13" fill="#5b7181" text-anchor="start">1</text><text x="92.0" y="200.0" font-family="Spectral SemiBold, serif" font-size="21" fill="#191a18" text-anchor="start">Corpus de entrada</text><text x="92.0" y="245.0" font-family="IBM Plex Sans Condensed, serif" font-size="16" fill="#55584f" text-anchor="start">Una planilla de discursos o un archivo de posts. Como mínimo, un identificador y</text><text x="92.0" y="266.0" font-family="IBM Plex Sans Condensed, serif" font-size="16" fill="#55584f" text-anchor="start">un texto por pieza.</text><rect x="40.0" y="320.0" width="600.0" height="118.0" fill="#fcfcfa" stroke="#c9ccc5" stroke-width="1.3"/><line x1="40.0" y1="320.0" x2="640.0" y2="320.0" stroke="#2e4551" stroke-width="3"/><text x="60.0" y="350.0" font-family="IBM Plex Mono, serif" font-size="13" fill="#5b7181" text-anchor="start">2</text><text x="92.0" y="352.0" font-family="Spectral SemiBold, serif" font-size="21" fill="#191a18" text-anchor="start">Análisis por etapas</text><text x="92.0" y="397.0" font-family="IBM Plex Sans Condensed, serif" font-size="16" fill="#55584f" text-anchor="start">Situación de habla, actores, emociones y su caracterización. Cada etapa guarda</text><text x="92.0" y="418.0" font-family="IBM Plex Sans Condensed, serif" font-size="16" fill="#55584f" text-anchor="start">su resultado antes de que empiece la siguiente.</text><path d="M340.0,292 L340.0,311" fill="none" stroke="#55584f" stroke-width="1.5"/><path d="M336.10,302.23 L340.00,311.00 L343.90,302.23" fill="none" stroke="#55584f" stroke-width="1.755" stroke-linecap="round" stroke-linejoin="round"/><rect x="40.0" y="472.0" width="600.0" height="118.0" fill="#fcfcfa" stroke="#c9ccc5" stroke-width="1.3"/><text x="60.0" y="502.0" font-family="IBM Plex Mono, serif" font-size="13" fill="#5b7181" text-anchor="start">3</text><text x="92.0" y="504.0" font-family="Spectral SemiBold, serif" font-size="21" fill="#191a18" text-anchor="start">Archivo de la corrida</text><text x="92.0" y="549.0" font-family="IBM Plex Sans Condensed, serif" font-size="16" fill="#55584f" text-anchor="start">Un archivo por análisis, con los resultados y las versiones exactas de todo lo que</text><text x="92.0" y="570.0" font-family="IBM Plex Sans Condensed, serif" font-size="16" fill="#55584f" text-anchor="start">se usó.</text><path d="M340.0,444 L340.0,463" fill="none" stroke="#55584f" stroke-width="1.5"/><path d="M336.10,454.23 L340.00,463.00 L343.90,454.23" fill="none" stroke="#55584f" stroke-width="1.755" stroke-linecap="round" stroke-linejoin="round"/><rect x="40.0" y="624.0" width="600.0" height="118.0" fill="#fcfcfa" stroke="#c9ccc5" stroke-width="1.3"/><text x="60.0" y="654.0" font-family="IBM Plex Mono, serif" font-size="13" fill="#5b7181" text-anchor="start">4</text><text x="92.0" y="656.0" font-family="Spectral SemiBold, serif" font-size="21" fill="#191a18" text-anchor="start">Revisión a mano</text><text x="92.0" y="701.0" font-family="IBM Plex Sans Condensed, serif" font-size="16" fill="#55584f" text-anchor="start">Unificar referentes, corregir atribuciones, resolver ambigüedades.</text><path d="M340.0,596 L340.0,615" fill="none" stroke="#55584f" stroke-width="1.5"/><path d="M336.10,606.23 L340.00,615.00 L343.90,606.23" fill="none" stroke="#55584f" stroke-width="1.755" stroke-linecap="round" stroke-linejoin="round"/><rect x="40.0" y="776.0" width="600.0" height="118.0" fill="#fcfcfa" stroke="#c9ccc5" stroke-width="1.3"/><text x="60.0" y="806.0" font-family="IBM Plex Mono, serif" font-size="13" fill="#5b7181" text-anchor="start">5</text><text x="92.0" y="808.0" font-family="Spectral SemiBold, serif" font-size="21" fill="#191a18" text-anchor="start">Tablero</text><text x="92.0" y="853.0" font-family="IBM Plex Sans Condensed, serif" font-size="16" fill="#55584f" text-anchor="start">Curvas, matrices, redes y búsqueda.</text><path d="M340.0,748 L340.0,767" fill="none" stroke="#55584f" stroke-width="1.5"/><path d="M336.10,758.23 L340.00,767.00 L343.90,758.23" fill="none" stroke="#55584f" stroke-width="1.755" stroke-linecap="round" stroke-linejoin="round"/><rect x="736.0" y="310.0" width="224.0" height="220.0" fill="#fcfcfa" stroke="#c9ccc5" stroke-width="1.3"/><text x="754.0" y="340.0" font-family="IBM Plex Mono, serif" font-size="12" fill="#5b7181" text-anchor="start" letter-spacing="0.1em">INSUMOS</text><text x="754.0" y="376.0" font-family="Spectral SemiBold, serif" font-size="18" fill="#191a18" text-anchor="start">Modelos locales y</text><text x="754.0" y="398.0" font-family="Spectral SemiBold, serif" font-size="18" fill="#191a18" text-anchor="start">categorías editables</text><text x="754.0" y="425.0" font-family="IBM Plex Sans Condensed, serif" font-size="14.5" fill="#55584f" text-anchor="start">Los modelos corren en la</text><text x="754.0" y="444.0" font-family="IBM Plex Sans Condensed, serif" font-size="14.5" fill="#55584f" text-anchor="start">misma computadora. Las listas</text><text x="754.0" y="463.0" font-family="IBM Plex Sans Condensed, serif" font-size="14.5" fill="#55584f" text-anchor="start">de emociones, los rasgos de los</text><text x="754.0" y="482.0" font-family="IBM Plex Sans Condensed, serif" font-size="14.5" fill="#55584f" text-anchor="start">actores y las reglas de</text><text x="754.0" y="501.0" font-family="IBM Plex Sans Condensed, serif" font-size="14.5" fill="#55584f" text-anchor="start">coherencia viven en archivos de</text><text x="754.0" y="520.0" font-family="IBM Plex Sans Condensed, serif" font-size="14.5" fill="#55584f" text-anchor="start">texto.</text><path d="M728,420.0 L650,420.0" fill="none" stroke="#55584f" stroke-width="1.5"/><path d="M658.77,416.10 L650.00,420.00 L658.77,423.90" fill="none" stroke="#55584f" stroke-width="1.755" stroke-linecap="round" stroke-linejoin="round"/><path d="M646,683.0 L684,683.0 L684,531.0 L650,531.0" fill="none" stroke="#5b7181" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M658.19,527.36 L650.00,531.00 L658.19,534.64" fill="none" stroke="#5b7181" stroke-width="1.638" stroke-linecap="round" stroke-linejoin="round"/><text x="742.0" y="664.0" font-family="IBM Plex Sans Condensed, serif" font-size="14.5" fill="#5b7181" text-anchor="start">las correcciones se</text><text x="742.0" y="683.0" font-family="IBM Plex Sans Condensed, serif" font-size="14.5" fill="#5b7181" text-anchor="start">materializan en el archivo</text><text x="40.0" y="975.0" font-family="IBM Plex Sans Condensed, serif" font-size="15" fill="#7e8179" text-anchor="start">Las etapas se pueden correr por bloques, revisando en el tablero lo que salió antes de seguir con las siguientes.</text></svg>