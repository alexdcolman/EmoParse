name: Preflight 7.1B temporal

on:
  push:
    branches:
      - assistant/7-1b-rc1-preflight

permissions:
  contents: read

jobs:
  focal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,scraping,ui]"
      - name: Focales 7.1B
        run: python -m pytest tests/contrato/test_cite_corpus.py -q

  lint-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,scraping,ui]"
      - name: Ruff
        run: ruff check src tests scripts
      - name: Ruff format
        run: ruff format --check src tests scripts
      - name: Mypy
        run: mypy

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,scraping,ui]"
      - run: python -m pytest tests/contrato -q
      - name: Andamio informativo
        continue-on-error: true
        run: python -m pytest tests/andamio -q
      - run: python -m pytest --collect-only -q

  not-llm-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,scraping,ui]"
      - run: python -m pytest -m "not llm" -q
      - run: python -m build --wheel
      - run: git diff --check

  cli-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Generar referencia para inspección
        run: python scripts/gen_cli_reference.py
      - name: Mostrar diff generado
        run: git diff -- docs/comandos.md docs/comandos.html
      - name: La referencia debe estar versionada
        run: git diff --exit-code -- docs/comandos.md docs/comandos.html
