name: Package 7.1B temporal

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sealed-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: assistant/7-1b-rc1-preflight
          fetch-depth: 0
      - name: Construir artefacto exacto sin workflows temporales
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mkdir -p sealed
          git diff --binary origin/main...HEAD -- . \
            ':(exclude).github/workflows/preflight-7-1b.yml' \
            ':(exclude).github/workflows/package-7-1b.yml' > sealed/CHANGE_71B.patch
          git diff --name-only origin/main...HEAD -- . \
            ':(exclude).github/workflows/preflight-7-1b.yml' \
            ':(exclude).github/workflows/package-7-1b.yml' > sealed/TARGET_MANIFEST.txt
          printf '%s\n' "$(git rev-parse origin/main)" > sealed/BASE_SHA.txt
          printf '%s\n' "$(git rev-parse HEAD)" > sealed/BRANCH_HEAD_SHA.txt
          git diff --check origin/main...HEAD -- . \
            ':(exclude).github/workflows/preflight-7-1b.yml' \
            ':(exclude).github/workflows/package-7-1b.yml'
          test -s sealed/CHANGE_71B.patch
          test -s sealed/TARGET_MANIFEST.txt
          sha256sum sealed/CHANGE_71B.patch sealed/TARGET_MANIFEST.txt > sealed/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-candidate-71b
          path: sealed/
