pipeline:
  stages:
    summarizer: qwen3-30b-moe
    metadata: gemma4-31b
    enunciation: gemma4-31b
    enunciator_id: gemma4-31b
    actors: qwen3-14b
    emotions: gemma4-31b
    emotions_pass2: qwen3.6-35b-a3b
    deixis: gemma4-31b
    modalidad: gemma4-31b
    semas: gemma4-31b
    characterizer: gemma4-31b
    actants: gemma4-31b
    judge: qwen3.6-35b-a3b
    reframing: qwen3.6-35b-a3b
    hashtag_semiotics: gemma4-31b
    emoji_affect: qwen3.6-35b-a3b
    tecno_usage: qwen3.6-35b-a3b
  cache_enabled: true
  parallel: 1
  max_retries: 3
  retry_delays_seconds:
  - 2
  - 8
  - 15
  timeout_seconds: 90
paths:
  runs_dir: ${EMOPARSE_RUNS_DIR:-runs}
  models_dir: ${EMOPARSE_MODELS_DIR:-models}
  knowledge_dir: ${EMOPARSE_KNOWLEDGE_DIR:-knowledge}
  inputs_dir: ${EMOPARSE_INPUTS_DIR:-data}
versions:
  knowledge: v19
  prompt: v76
  ontology: v30
  schema: v55
logging:
  level: INFO
  log_to_file: true
  rotation: 10 MB
  retention: 7 days
notes: "Run de producción. Bumpear versions cuando cambien:\n  - knowledge:  datos\
  \ base del proyecto.\n  - prompt:     templates, heurísticas y composición del contexto\
  \ de los agentes.\n  - ontology:   versión histórica del catálogo ex post y otros\
  \ JSON; nunca implica inyección en prompts.\n  - schema:     schemas Pydantic de\
  \ salida.\n"
